# Data configuration - Separate train/val/test files
data_dir: "/content/drive/MyDrive/dlnlp-assignment/assignment2/data"
train_data_path: "hin_train.json"
val_data_path: "hin_valid.json"     # New validation file
test_data_path: "hin_test.json"
sample_size: 100000
sampling_method: "fast"
batch_size: 64

# Model configuration
model_type: "transformer"  # Choose: "transformer" or "lstm"

# Transformer-specific parameters
d_model: 256
nhead: 8
num_encoder_layers: 2
num_decoder_layers: 2
dim_feedforward: 512
transformer_dropout: 0.1
max_len: 5000

# LSTM-specific parameters (for backward compatibility)
# embedding_dim: 128
# hidden_dim: 256
# num_layers: 2
# dropout: 0.3

# Training configuration
learning_rate: 0.0005
lr_decay_factor: 0.8
lr_patience: 3
min_lr: 1e-6
num_epochs: 50
teacher_forcing_ratio: 0.99
final_teacher_forcing: 0.7
teacher_forcing_decay: 0.97
grad_clip: 1.0
patience: 5
seed: 42

# Save configuration
save_dir: "/content/drive/MyDrive/dlnlp-assignment/assignment2/ckpts"