# Data configuration - Separate train/val/test files
data_dir: "/content/drive/MyDrive/dlnlp-assignment/assignment2/data"
train_data_path: "hin_train.json"
val_data_path: "hin_valid.json"     # New validation file
test_data_path: "hin_test.json"
sample_size: 100000
sampling_method: "fast"
batch_size: 128

# Model configuration
embedding_dim: 128
hidden_dim: 256
num_layers: 2
dropout: 0.1

