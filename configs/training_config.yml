min_lr: 1e-6
num_epochs: 50
teacher_forcing_ratio: 0.99
final_teacher_forcing: 0.7
teacher_forcing_decay: 0.95
grad_clip: 1.0
patience: 7
seed: 42

# Save configuration
save_dir: "/content/drive/MyDrive/dlnlp-assignment/assignment2/ckpts"